name: Update Template Files Across Repos

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: template-files
  NODE_VERSION: 24.14.1

jobs:
  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm i

      - name: Create Release Pull Request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version-script: pnpm run version
          commit-message: "ci: release"
          pr-title: "ci: release [skip netlify]"
          github-token: ${{ steps.generate_token.outputs.token}}
          push-with-git-cli: true

      - name: Get published version
        if: steps.changesets.outputs.has-changesets == 'true'
        run: |
          git checkout changeset-release/main
          VERSION=$(node -p "require('./package.json').version")
          git commit --amend -m "ci: release ${{ env.IMAGE_NAME }} v$VERSION" --no-edit
          git push origin changeset-release/main:changeset-release/main --force

  prepare-matrix:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.matrix.outputs.repositories }}
    steps:
      - name: Checkout current repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read repositories
        id: matrix
        run: echo "repositories=$(jq -c '[.repositories[].name]' repositories.json)" >> "$GITHUB_OUTPUT"

  sync:
    name: Sync ${{ matrix.repository }}
    needs: [changesets, prepare-matrix]
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJson(needs.prepare-matrix.outputs.repositories) }}
    if: >
      (
        needs.changesets.outputs.has-changesets == 'false' &&
        (
          contains(github.event.head_commit.message, 'deploy') ||
          contains(github.event.head_commit.message, 'release')
        )
      ) ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/sync-repository.yaml
    with:
      repository: ${{ matrix.repository }}
    secrets: inherit

  summarize:
    name: Synchronization Report
    runs-on: ubuntu-latest
    needs: sync
    if: ${{ !cancelled() && needs.sync.result != 'skipped' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm i

      - name: Download summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: summary
          pattern: summary-*
          merge-multiple: true

      - name: Generate reports
        run: |
          mkdir -p summary
          pnpm report summary

      - name: Upload final summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final-summary
          path: summary/final_summary.md

      - name: Display summary in the GitHub Actions summary
        run: cat summary/final_summary.md >> "$GITHUB_STEP_SUMMARY"

  image-tag:
    name: Image Tag
    runs-on: ubuntu-latest
    outputs:
      IMAGE_TAG: ${{ env.IMAGE_TAG }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "IMAGE_TAG=$VERSION" >> "$GITHUB_ENV"

  release:
    name: Release
    needs: [sync, image-tag, summarize]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: extract-changelog
        uses: sean0x42/markdown-extract@7b185cbe85263116bbf741e739e7198ba86465dc # v2.1.0
        with:
          file: CHANGELOG.md
          pattern: ${{ needs.image-tag.outputs.IMAGE_TAG }}

      - name: Download summary artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: final-summary

      - name: Save summary into Github environment variable
        run: |
          {
            echo "SYNC_SUMMARY<<EOF"
            cat final_summary.md
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: ncipollo/release-action@v1
        id: create_release
        with:
          tag: ${{ env.IMAGE_NAME }}@${{ needs.image-tag.outputs.IMAGE_TAG }}
          makeLatest: true
          body: |
            ${{ steps.extract-changelog.outputs.markdown }}

            ${{ env.SYNC_SUMMARY }}
          skipIfReleaseExists: true
